<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="InventraX">
  <defs>
    <linearGradient id="inventrax-x" x1="8%" y1="12%" x2="92%" y2="88%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <!-- Matches Tailwind: from-sky-500 via-indigo-500 to-violet-600; bold italic X like InventraXWordmark -->
  <text
    x="50%"
    y="54%"
    dominant-baseline="middle"
    text-anchor="middle"
    fill="url(#inventrax-x)"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="52"
    font-weight="900"
    font-style="italic"
    letter-spacing="-0.04em"
  >X</text>
</svg>
